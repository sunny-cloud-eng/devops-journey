name: UptimeGuard CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd app
          pip install -r requirements.txt

      - name: Test app imports (basic test)
        run: |
          cd app
          python -c "import app; print('App imports successfully!')"

      - name: Build Docker image
        run: |
          cd app
          docker build -t uptimeguard:latest .
          echo "Docker image built successfully!"

      - name: Verify Docker image
        run: docker images | grep uptimeguard
